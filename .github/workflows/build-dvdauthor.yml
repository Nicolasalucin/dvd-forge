name: Build DVDAuthor for Windows

# Builds the official dvdauthor sources (github.com/ldo/dvdauthor, pinned tag
# and commit) with MSYS2 UCRT64 and publishes a zip with dvdauthor.exe,
# spumux.exe and their DLLs. DVD Forge's one-click installer downloads that
# zip and checks its SHA-256 before extracting it.
on:
  workflow_dispatch:
    inputs:
      publish:
        description: "Publish the zip as a pre-release of this repository"
        type: boolean
        default: false

permissions:
  contents: write

env:
  DVDAUTHOR_TAG: "0.7.2"
  DVDAUTHOR_SHA256: "fd66b92f6c67bd406030ff0f1c3233175768b534df4d341c3f380ecd61de91b5"

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        shell: msys2 {0}
    steps:
      - uses: msys2/setup-msys2@v2
        with:
          msystem: UCRT64
          update: true
          install: >-
            git zip autotools gettext-devel flex bison
            mingw-w64-ucrt-x86_64-gettext-tools
            mingw-w64-ucrt-x86_64-libiconv
            mingw-w64-ucrt-x86_64-toolchain
            mingw-w64-ucrt-x86_64-pkgconf
            mingw-w64-ucrt-x86_64-libxml2
            mingw-w64-ucrt-x86_64-libpng
            mingw-w64-ucrt-x86_64-freetype
            mingw-w64-ucrt-x86_64-fontconfig
            mingw-w64-ucrt-x86_64-fribidi

      - name: Fetch pinned sources
        run: |
          # Official 0.7.2 release tarball (ships a generated configure),
          # archived by Debian; SHA-256 from dvdauthor_0.7.2-2.dsc.
          curl -fsSL -o dvdauthor.tar.gz "https://deb.debian.org/debian/pool/main/d/dvdauthor/dvdauthor_0.7.2.orig.tar.gz"
          echo "$DVDAUTHOR_SHA256  dvdauthor.tar.gz" | sha256sum -c -
          mkdir src
          tar -xzf dvdauthor.tar.gz -C src --strip-components=1
          ls src | head -30

      - name: Build
        run: |
          export ACLOCAL_PATH="/ucrt64/share/aclocal:/usr/share/aclocal"
          cd src
          mkdir -p autotools m4
          # libxml2 no longer ships libxml.m4 (AM_PATH_XML2): provide it via pkg-config.
          cat > m4/xml2-compat.m4 <<'EOF'
          AC_DEFUN([AM_PATH_XML2], [
            PKG_CHECK_MODULES([XML2], [libxml-2.0 >= $1],
              [XML_CPPFLAGS="$XML2_CFLAGS"; XML_LIBS="$XML2_LIBS"; $2], [$3])
            AC_SUBST(XML_CPPFLAGS)
            AC_SUBST(XML_LIBS)
          ])
          EOF
          sed -i 's/^          //' m4/xml2-compat.m4
          # Windows mkdir() takes only the path (three calls in dvdauthor.c).
          sed -i -E 's/mkdir\(([a-z]+), 0777\)/mkdir(\1)/' src/dvdauthor.c
          grep -n "mkdir(" src/dvdauthor.c
          cp /usr/share/gettext/config.rpath autotools/
          autoreconf -fi -I m4
          # MSYS2 FreeType has no freetype-config; configure.ac requires it.
          mkdir -p ../shim
          cat > ../shim/freetype-config <<'EOF'
          #!/bin/sh
          case "$1" in
            --cflags) pkg-config --cflags freetype2 ;;
            --libs) pkg-config --libs freetype2 ;;
            --version) pkg-config --modversion freetype2 ;;
          esac
          EOF
          sed -i 's/^          //' ../shim/freetype-config
          chmod +x ../shim/freetype-config
          export PATH="$PWD/../shim:$PATH"
          ./configure --prefix="$PWD/../stage" --disable-dvdunauthor || { tail -80 config.log; exit 1; }
          # Only the programs: the man pages need DocBook, not shipped.
          # fsync() is _commit() in the Windows CRT (<io.h>); only for make,
          # configure's own feature tests must not see the forced include.
          # Two POSIX headers Windows lacks: langinfo.h (charset name) and
          # netinet/in.h (byte order helpers).
          mkdir -p ../winshim/netinet
          cat > ../winshim/langinfo.h <<'EOF'
          #pragma once
          #define CODESET 0
          static inline char *nl_langinfo(int item) { (void)item; return (char *)"UTF-8"; }
          EOF
          cat > ../winshim/netinet/in.h <<'EOF'
          #pragma once
          #include <stdint.h>
          static inline uint32_t htonl(uint32_t v) { return __builtin_bswap32(v); }
          static inline uint32_t ntohl(uint32_t v) { return __builtin_bswap32(v); }
          static inline uint16_t htons(uint16_t v) { return __builtin_bswap16(v); }
          static inline uint16_t ntohs(uint16_t v) { return __builtin_bswap16(v); }
          EOF
          cat > ../winshim/wincompat.h <<'EOF'
          #pragma once
          #include <io.h>
          #include <string.h>
          #define fsync _commit
          #define bzero(p, n) memset((p), 0, (n))
          #define bcopy(s, d, n) memmove((d), (s), (n))
          EOF
          WINFLAGS="CPPFLAGS=-I$PWD/../winshim -include wincompat.h"
          # Only the two programs DVD Forge runs (mpeg2desc/spuunmux are
          # debugging tools that use POSIX select()).
          make -C src -j4 "$WINFLAGS" dvdauthor.exe spumux.exe || make -C src "$WINFLAGS" dvdauthor.exe spumux.exe
          mkdir -p ../stage/bin
          # libtool leaves small wrapper .exe files in src/; the real
          # programs are in src/.libs/ when it links against shared libraries.
          for exe in dvdauthor spumux; do
            if [ -f "src/.libs/$exe.exe" ]; then cp "src/.libs/$exe.exe" ../stage/bin/; else cp "src/$exe.exe" ../stage/bin/; fi
          done
          ls -la src/.libs 2>/dev/null | head; ls -la ../stage/bin

      - name: Collect executables and DLLs
        run: |
          mkdir -p dist
          for exe in dvdauthor spumux spuunmux; do
            [ -f "stage/bin/$exe.exe" ] && cp "stage/bin/$exe.exe" dist/
          done
          # Every non-system DLL the executables need, recursively.
          for pass in 1 2 3 4; do
            for file in dist/*.exe dist/*.dll; do
              [ -f "$file" ] || continue
              ldd "$file" | awk '/ucrt64/ {print $3}' | while read -r dll; do
                cp -n "$dll" dist/ 2>/dev/null || true
              done
            done
          done
          cp src/COPYING dist/COPYING.dvdauthor.txt 2>/dev/null || true
          printf 'dvdauthor %s (source sha256 %s) built by GitHub Actions run %s\nSource: https://github.com/ldo/dvdauthor\nLicense: GPL-2.0-or-later\n' \
            "$DVDAUTHOR_TAG" "$DVDAUTHOR_SHA256" "$GITHUB_RUN_ID" > dist/README.txt
          ls -la dist

      - name: Smoke test
        run: |
          cd dist
          a=$(./dvdauthor.exe -h 2>&1 || true)
          b=$(./spumux.exe -h 2>&1 || true)
          echo "$a" | head -4
          echo "$b" | head -4
          case "$a" in *"version $DVDAUTHOR_TAG"*) ;; *) echo "dvdauthor did not run"; exit 1 ;; esac
          case "$b" in *"version $DVDAUTHOR_TAG"*) ;; *) echo "spumux did not run"; exit 1 ;; esac

      - name: Package
        run: |
          name="dvdauthor-$DVDAUTHOR_TAG-windows-x86_64.zip"
          (cd dist && zip -X -r "../$name" .)
          sha256sum "$name" | tee "$name.sha256"
          stat -c '%s bytes' "$name"

      - uses: actions/upload-artifact@v4
        with:
          name: dvdauthor-windows-x86_64
          path: |
            dvdauthor-*-windows-x86_64.zip
            dvdauthor-*-windows-x86_64.zip.sha256

      - name: Publish pre-release
        if: ${{ inputs.publish }}
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag="tools-dvdauthor-$DVDAUTHOR_TAG"
          gh release view "$tag" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || gh release create "$tag" -R "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" \
            --prerelease --title "Tools: DVDAuthor $DVDAUTHOR_TAG for Windows" \
            --notes "dvdauthor $DVDAUTHOR_TAG (official release tarball, SHA-256 $DVDAUTHOR_SHA256) built by the 'Build DVDAuthor for Windows' workflow. Used by DVD Forge's one-click installer, which verifies the SHA-256 below. License: GPL-2.0-or-later."
          gh release upload "$tag" -R "$GITHUB_REPOSITORY" dvdauthor-*-windows-x86_64.zip dvdauthor-*-windows-x86_64.zip.sha256 --clobber

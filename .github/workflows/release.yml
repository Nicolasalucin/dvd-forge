name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            desktop: true
            cli_archive: dvdforge-cli-x86_64-unknown-linux-gnu.tar.gz
          - name: linux-i686
            arch: i686
            target: i686-unknown-linux-gnu
            bundles: none
            desktop: false
            cli_archive: dvdforge-cli-i686-unknown-linux.tar.gz

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install 32-bit toolchain
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 pkg-config

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate bindings
        working-directory: apps/desktop
        run: npm run bindings

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p dvdforge-cli

      - name: Build desktop bundles
        if: matrix.desktop
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Package Linux CLI
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/dvdforge-cli" \
             "target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf \
             "artifacts/${{ matrix.cli_archive }}" "dvdforge-cli"

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dvdforge-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            artifacts/*.tar.gz
            target/${{ matrix.target }}/release/bundle/appimage/*.AppImage
            target/${{ matrix.target }}/release/bundle/deb/*.deb

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - name: windows-i686
            arch: i686
            target: i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate bindings
        working-directory: apps/desktop
        run: npm run bindings

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p dvdforge-cli

      - name: Build desktop installers
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles msi,nsis

      - name: Package portable CLI
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path artifacts | Out-Null
          $exe = "target/${{ matrix.target }}/release/dvdforge-cli.exe"
          $dest = "artifacts/dvdforge-cli-${{ matrix.target }}.exe"
          Copy-Item $exe $dest
          if ("${{ matrix.arch }}" -eq "i686") {
            Compress-Archive -Path $exe -DestinationPath "artifacts/dvdforge-cli-i686-pc-windows-msvc.zip" -Force
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dvdforge-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            artifacts/*
            target/${{ matrix.target }}/release/bundle/msi/*.msi
            target/${{ matrix.target }}/release/bundle/nsis/*-setup.exe

  macos:
    name: macOS ${{ matrix.arch }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: macos-aarch64
            arch: aarch64
            target: aarch64-apple-darwin
            os: macos-15
          - name: macos-x86_64
            arch: x86_64
            target: x86_64-apple-darwin
            os: macos-15-intel

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate bindings
        working-directory: apps/desktop
        run: npm run bindings

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p dvdforge-cli

      - name: Build desktop bundles
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles dmg

      - name: Package macOS CLI
        shell: bash
        run: |
          mkdir -p artifacts
          cp "target/${{ matrix.target }}/release/dvdforge-cli" \
             "target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.target }}"
          tar -C "target/${{ matrix.target }}/release" -czf \
             "artifacts/dvdforge-cli-${{ matrix.target }}.tar.gz" "dvdforge-cli"

      - name: Upload macOS artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dvdforge-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            artifacts/*.tar.gz
            target/${{ matrix.target }}/release/bundle/dmg/*.dmg

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows, macos]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release files
        shell: bash
        run: |
          mkdir -p release
          find artifacts -type f \( \
            -name 'dvdforge-cli-*' -o \
            -name 'dvdforge-desktop-*' -o \
            -name '*.AppImage' -o \
            -name '*.deb' -o \
            -name '*.msi' -o \
            -name '*-setup.exe' -o \
            -name '*.dmg' -o \
            -name '*.tar.gz' -o \
            -name '*.zip' \
          \) -exec cp -v {} release/ \;
          test -f release/dvdforge-cli-i686-unknown-linux.tar.gz
          test -f release/dvdforge-cli-i686-pc-windows-msvc.zip
          test "$(find release -name '*.dmg' | wc -l)" -ge 2
          test "$(find release \( -name '*.AppImage' -o -name '*.deb' \) | wc -l)" -ge 1
          test "$(find release \( -name '*.msi' -o -name '*-setup.exe' \) | wc -l)" -ge 2
          ls -lh release

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: release/*
          generate_release_notes: true
          draft: false
          prerelease: false

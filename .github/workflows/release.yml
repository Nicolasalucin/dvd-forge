name: Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  linux:
    name: Linux ${{ matrix.arch }}
    runs-on: ubuntu-22.04
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux-x86_64
            arch: x86_64
            target: x86_64-unknown-linux-gnu
            bundles: appimage,deb
            bundles_desktop: true
            experimental_desktop: false
          - name: linux-i686
            arch: i686
            target: i686-unknown-linux-gnu
            bundles: none
            bundles_desktop: false
            # WebKitGTK 32-bit is not available in every distribution. The CLI
            # is always built; the portable desktop is attempted when the
            # runner can provide a 32-bit GTK/WebKit sysroot.
            experimental_desktop: true

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install Linux dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            build-essential curl wget file libssl-dev libxdo-dev \
            libwebkit2gtk-4.1-dev libgtk-3-dev \
            libayatana-appindicator3-dev librsvg2-dev patchelf

      - name: Install 32-bit toolchain
        if: matrix.arch == 'i686'
        run: |
          sudo dpkg --add-architecture i386
          sudo apt-get update
          sudo apt-get install -y gcc-multilib g++-multilib libc6-dev-i386 pkg-config
          # Best effort: distributions that ship 32-bit GTK/WebKit headers can
          # build the portable desktop. Missing packages only disable that
          # optional artifact; the 32-bit CLI is unaffected.
          sudo apt-get install -y \
            libgtk-3-dev:i386 libwebkit2gtk-4.1-dev:i386 \
            libayatana-appindicator3-dev:i386 librsvg2-dev:i386 \
            libssl-dev:i386 || true

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate bindings
        working-directory: apps/desktop
        run: npm run bindings

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p dvdforge-cli

      - name: Build desktop bundles
        if: matrix.bundles_desktop
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles ${{ matrix.bundles }}

      - name: Build portable desktop (32-bit, best effort)
        if: ${{ !matrix.bundles_desktop }}
        continue-on-error: ${{ matrix.experimental_desktop }}
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --no-bundle

      - name: Prepare portable binaries
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/dvdforge-cli" \
             "target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.name }}"
          if [ -f "target/${{ matrix.target }}/release/dvdforge-desktop" ]; then
            cp "target/${{ matrix.target }}/release/dvdforge-desktop" \
               "target/${{ matrix.target }}/release/dvdforge-desktop-${{ matrix.name }}"
          fi

      - name: Upload Linux artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dvdforge-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.name }}
            target/${{ matrix.target }}/release/dvdforge-desktop-${{ matrix.name }}
            target/${{ matrix.target }}/release/bundle/**/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*

  windows:
    name: Windows ${{ matrix.arch }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: windows-x86_64
            arch: x86_64
            target: x86_64-pc-windows-msvc
          - name: windows-i686
            arch: i686
            target: i686-pc-windows-msvc

    steps:
      - uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}

      - name: Cache Rust
        uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/desktop/package-lock.json

      - name: Install frontend dependencies
        working-directory: apps/desktop
        run: npm ci

      - name: Generate bindings
        working-directory: apps/desktop
        run: npm run bindings

      - name: Build CLI
        run: cargo build --release --target ${{ matrix.target }} -p dvdforge-cli

      - name: Build desktop installers
        working-directory: apps/desktop
        run: npm run tauri -- build --target ${{ matrix.target }} --bundles msi,nsis

      - name: Prepare portable binaries
        shell: pwsh
        run: |
          Copy-Item "target/${{ matrix.target }}/release/dvdforge-cli.exe" `
            "target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.name }}.exe"
          if (Test-Path "target/${{ matrix.target }}/release/dvdforge-desktop.exe") {
            Copy-Item "target/${{ matrix.target }}/release/dvdforge-desktop.exe" `
              "target/${{ matrix.target }}/release/dvdforge-desktop-${{ matrix.name }}.exe"
          }

      - name: Upload Windows artifacts
        uses: actions/upload-artifact@v4
        with:
          name: dvdforge-${{ matrix.name }}
          if-no-files-found: warn
          path: |
            target/${{ matrix.target }}/release/dvdforge-cli-${{ matrix.name }}.exe
            target/${{ matrix.target }}/release/dvdforge-desktop-${{ matrix.name }}.exe
            target/${{ matrix.target }}/release/bundle/**/*
            apps/desktop/src-tauri/target/${{ matrix.target }}/release/bundle/**/*

  release:
    name: Publish GitHub release
    if: startsWith(github.ref, 'refs/tags/v')
    needs: [linux, windows]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*
          generate_release_notes: true
          draft: false
          prerelease: false

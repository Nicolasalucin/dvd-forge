[package]
name = "kinodisc-desktop"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
authors.workspace = true
default-run = "kinodisc-desktop"

[lib]
name = "kinodisc_desktop"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "kinodisc-desktop"
path = "src/main.rs"

[[bin]]
name = "export-bindings"
path = "src/bin/export_bindings.rs"

[build-dependencies]
tauri-build = { version = "2.6.3", features = [] }

[dependencies]
base64.workspace = true
chrono.workspace = true
kinodisc-burn = { path = "../../../crates/kinodisc-burn" }
kinodisc-domain = { path = "../../../crates/kinodisc-domain" }
kinodisc-jobs = { path = "../../../crates/kinodisc-jobs" }
kinodisc-media = { path = "../../../crates/kinodisc-media" }
kinodisc-menu = { path = "../../../crates/kinodisc-menu" }
kinodisc-plan = { path = "../../../crates/kinodisc-plan" }
kinodisc-project = { path = "../../../crates/kinodisc-project" }
kinodisc-render = { path = "../../../crates/kinodisc-render" }
kinodisc-store = { path = "../../../crates/kinodisc-store" }
kinodisc-toolchain = { path = "../../../crates/kinodisc-toolchain" }
kinodisc-verify = { path = "../../../crates/kinodisc-verify" }
fontdb.workspace = true
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
specta.workspace = true
specta-typescript = "=0.0.13"
tauri = { version = "2.11.6", features = [] }
tauri-plugin-dialog = "2"
tauri-specta = { version = "=2.0.0-rc.26", features = ["derive", "typescript"] }
tokio.workspace = true
uuid.workspace = true

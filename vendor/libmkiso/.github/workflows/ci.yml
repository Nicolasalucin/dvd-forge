name: Optical image library
on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  pull_request:
    paths-ignore:
      - '**/*.md'
      - 'docs/**'
  workflow_call:
concurrency:
  group: ${{ github.workflow }}-checks-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: rustfmt, clippy
          targets: wasm32-unknown-unknown
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: linux-validation
          workspaces: |
            . -> target
            fuzz -> target
      - run: cargo fmt -- --check
      - run: cargo test --all-features --locked
      - run: cargo test --features cli --locked
      - run: cargo test --no-default-features --locked
      - run: cargo clippy --all-targets --all-features --locked -- -D warnings
      - run: cargo check --no-default-features --target wasm32-unknown-unknown --locked
      - run: cargo fmt --manifest-path fuzz/Cargo.toml -- --check
      - run: cargo clippy --manifest-path fuzz/Cargo.toml --all-targets --locked -- -D warnings
      - run: cargo test --manifest-path fuzz/Cargo.toml --locked

  windows:
    # Releases validate on Linux and test the Windows CLI in the binary job.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked
      - run: cargo test --features cli --locked
      - run: cargo test --no-default-features --locked

  macos:
    # Exercise native directory publication before a release tag is created.
    if: ${{ !startsWith(github.ref, 'refs/tags/') }}
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@1.96.0
      - uses: Swatinem/rust-cache@v2
      - run: cargo test --all-features --locked
      - run: cargo test --features cli --locked
      - run: cargo test --no-default-features --locked

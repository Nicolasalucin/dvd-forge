[workspace]
resolver = "2"
members = [
    "crates/dvdforge-domain",
    "crates/dvdforge-project",
    "crates/dvdforge-media",
    "crates/dvdforge-menu",
    "crates/dvdforge-plan",
    "crates/dvdforge-dvd",
    "crates/dvdforge-avchd",
    "crates/dvdforge-hdmv",
    "crates/dvdforge-iso",
    "crates/dvdforge-burn",
    "crates/dvdforge-jobs",
    "crates/dvdforge-toolchain",
    "crates/dvdforge-store",
    "crates/dvdforge-testkit",
    "crates/dvdforge-cli",
    "crates/dvdforge-render",
    "apps/desktop/src-tauri",
]
exclude = ["vendor/libmkiso"]

[workspace.package]
version = "0.2.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
authors = ["DVD Forge contributors"]
repository = "https://github.com/Nicolasalucin/dvd-forge"

[workspace.dependencies]
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1.0", features = ["v4", "serde"] }

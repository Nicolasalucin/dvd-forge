[workspace]
resolver = "2"
members = [
    "crates/kinodisc-domain",
    "crates/kinodisc-project",
    "crates/kinodisc-media",
    "crates/kinodisc-menu",
    "crates/kinodisc-plan",
    "crates/kinodisc-dvd",
    "crates/kinodisc-avchd",
    "crates/kinodisc-hdmv",
    "crates/kinodisc-iso",
    "crates/kinodisc-burn",
    "crates/kinodisc-jobs",
    "crates/kinodisc-toolchain",
    "crates/kinodisc-store",
    "crates/kinodisc-testkit",
    "crates/kinodisc-cli",
    "crates/kinodisc-verify",
    "crates/kinodisc-render",
    "crates/kinodisc-subtitle",
    "apps/desktop/src-tauri",
]
exclude = ["vendor/libmkiso"]

[workspace.package]
version = "0.9.0"
edition = "2021"
rust-version = "1.96"
license = "GPL-3.0-or-later"
authors = ["Kinodisc contributors"]
repository = "https://github.com/Nicolasalucin/kinodisc"

[profile.release]
lto = "thin"
codegen-units = 1
strip = "symbols"

[workspace.dependencies]
ab_glyph = "0.2"
anyhow = "1"
async-trait = "0.1"
base64 = "0.22"
chrono = { version = "0.4", features = ["clock"] }
hex = "0.4"
libc = "0.2"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = { version = "0.4", default-features = false }
zstd = { version = "0.13", default-features = false }
specta = { version = "=2.0.0-rc.26", features = ["derive", "uuid"] }
thiserror = "2.0"
tokio = { version = "1.40", features = ["fs", "io-util", "macros", "process", "rt-multi-thread", "signal", "sync", "time"] }
tokio-util = { version = "0.7", features = ["rt"] }
fontdb = "0.23"
image = { version = "0.25", default-features = false, features = ["png"] }
uuid = { version = "1.0", features = ["v4", "serde"] }
